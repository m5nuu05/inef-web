<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel</title>
    <link rel="stylesheet" href="carrusel.css">
</head>
<body>
    <div class="carrusel-container">
        <input type="radio" name="carrusel-control" id="slide-1" checked>
        <input type="radio" name="carrusel-control" id="slide-2">
        <input type="radio" name="carrusel-control" id="slide-3">
        <input type="radio" name="carrusel-control" id="slide-4">
        <input type="radio" name="carrusel-control" id="slide-5">

        <div class="carrusel-slides">
            <div class="slide"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT5KRS89f_iTQpbc9JkJ1BqiLpziOhJs1U8fyuF7AOj1rG5usbyFGxozK0&s=10" alt="Imagen 1"></div>
            <div class="slide"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRdm0Z7KpQ9qqbq49smcW3Zzm2lgIMTdidiAJY6w6naErYwb15WD7jcWJM&s=10" alt="Imagen 2"></div>
            <div class="slide"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQFO5BhHC-QDP7G4myZw2luZ0M2rYRIzT95cS60mllGQQ&s" alt="Imagen 3"></div>
            <div class="slide"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQNxF9KbrjLfHjIbFkw4N-eaHFuphaGxyPGeLZFMlNrbG2-bChRIC6WO9kS&s=10" alt="Imagen 4"></div>
            <div class="slide"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSHkCoPiGs2D_pBjAT5xVrZBn4HeKkuQSBQrlHTtRys52OE5vHCCwMTVM8&s=10" alt="Imagen 5"></div>
        </div>

        <div class="carrusel-navegacion">
            <label for="slide-1" class="nav-dot"></label>
            <label for="slide-2" class="nav-dot"></label>
            <label for="slide-3" class="nav-dot"></label>
            <label for="slide-4" class="nav-dot"></label>
            <label for="slide-5" class="nav-dot"></label>
        </div>
    </div>
</body>
</html>
